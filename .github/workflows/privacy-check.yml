name: Privacy check

# Fails a pull request (or a push to main) that would make the hosted build contact
# other sites, add an unreviewed library, or weaken the Content-Security-Policy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-check:
    name: Privacy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build the app (runs the privacy check)
        working-directory: client
        run: npm run build
      - name: Audit production dependencies
        working-directory: client
        run: npm audit --omit=dev --audit-level=high
