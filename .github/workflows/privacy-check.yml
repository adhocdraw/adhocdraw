name: Privacy check

# Fails a pull request (or a push to main) that would make the hosted build contact
# other sites, add an unreviewed library, or weaken the Content-Security-Policy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-check:
    name: Privacy check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build the app (runs the privacy check)
        working-directory: client
        run: npm run build
      - name: Audit production dependencies
        working-directory: client
        run: npm audit --omit=dev --audit-level=high
